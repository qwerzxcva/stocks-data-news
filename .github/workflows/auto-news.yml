# 每 2h 采集 7x24 新闻(工作日盘中 7 轮); 2026-10-11 降频: 30min→2h 省 ~880min/月(Actions 配额超支修复)
# 免费额度: 每轮 ~0.5min, 48轮/天 × 22天 ≈ 528 min/月
# 注: 公开仓 Actions 分钟计入 2000/月, 如需 7x24 全时段再加 cron
name: auto-news
on:
  schedule:
    - cron: '10 1,3,5,7,9,11,13 * * 1-5'  # 每2小时一次(盘中7轮),省配额
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: qwerzxcva/t4
          path: tools-repo
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Collect news
        env:
          STOCKS_NEWS_DIR: ${{ github.workspace }}/news
        run: python3 tools-repo/tools/news_collect.py ${{ github.workspace }}
      - name: Commit & push
        run: |
          git config user.name "stocks-bot"
          git config user.email "41888888888+stocks-bot@users.noreply.github.com"
          git add -A
          ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
          git diff --quiet HEAD && echo "no changes" || {
            git commit -m "auto-news $ts" && \
            git -c http.version=HTTP/1.1 push origin main
          }
